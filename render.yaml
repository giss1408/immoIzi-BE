# Render Blueprint: https://render.com/docs/blueprint-spec
# Dashboard → New → Blueprint → select this repository.
services:
  - type: web
    name: immoizi-backend
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: ./build.sh
    startCommand: cd immoizi && gunicorn immoizi.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Your existing PostgreSQL database. For a Render database, use its
      # "Internal Database URL" (same region as this service); for Neon or
      # another provider, use the external URL with ?sslmode=require.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: LANGUAGE_CODE
        value: fr
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      # Cloudinary keeps uploaded photos/videos across deploys (Render's disk
      # is wiped on each deploy). Paste cloudinary://<key>:<secret>@<cloud>.
      - key: CLOUDINARY_URL
        sync: false
      # Test deployment: seed demo accounts with a password you choose.
      - key: SEED_DEMO_DATA
        value: "True"
      - key: DEMO_PASSWORD
        sync: false
